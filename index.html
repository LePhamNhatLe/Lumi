<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#08101f"/><meta name="description" content="Lumi - ứng dụng nghe nhạc từ YouTube."/><link rel="manifest" href="manifest.webmanifest"/><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"/><link rel="stylesheet" href="styles.css"/><title>Lumi — Nghe nhạc theo cách của bạn</title></head>
<body><main class="app-shell"><header class="topbar"><a class="brand" href="#home"><span>◈</span> lumi</a><label class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="Tìm bất kỳ bài hát hoặc ca sĩ..." autocomplete="off"/></label><button id="searchBtn" class="primary small">Tìm nhạc</button></header>
<section class="hero" id="home"><div><p class="eyebrow">LUMI × YOUTUBE</p><h1>Nghe bài<br/>anh muốn.</h1><p class="hero-copy">Tìm tên bài hát, ca sĩ hoặc album. Lumi phát bằng trình phát YouTube chính thức.</p><button class="primary" id="playFeatured">▶ Phát gợi ý</button></div><div class="featured-card player-card"><div id="youtubePlayer" class="youtube-player"></div><div id="playerFallback" class="cover cover-featured">Sẵn sàng<br/>nghe nhạc</div><div><p class="muted">ĐANG PHÁT</p><h2 id="featureTitle">Chọn một bài hát</h2><p id="featureArtist">Kết quả từ YouTube</p></div></div></section>
<section class="section-head"><div><p class="eyebrow">KẾT QUẢ</p><h2 id="playlistTitle">Tìm một bài để bắt đầu</h2></div><button class="text-button" id="clearBtn">Xóa kết quả</button></section><section class="playlist" id="playlist"></section>
<section class="section-head"><div><p class="eyebrow">KHÁM PHÁ</p><h2>Gợi ý tìm kiếm</h2></div></section><section class="moods"><button class="mood all" data-query="nhạc chill"><span>☷</span>Nhạc chill</button><button class="mood blue" data-query="nhạc tập trung"><span>✦</span>Tập trung</button><button class="mood pink" data-query="nhạc Việt mới"><span>☾</span>Nhạc Việt</button><button class="mood orange" data-query="nhạc năng lượng"><span>↗</span>Năng lượng</button></section></main>
<aside class="player"><div class="now-playing"><div class="cover mini">▶</div><div><strong id="nowTitle">Chưa phát bài nào</strong><span id="nowArtist">Lumi Music</span></div></div><div class="controls"><button id="prevBtn" title="Bài trước">◀◀</button><button class="play" id="playBtn" title="Phát / tạm dừng">▶</button><button id="nextBtn" title="Bài tiếp">▶▶</button></div><div class="timeline"><span id="currentTime">0:00</span><input id="progress" type="range" min="0" max="100" value="0"/><span id="duration">0:00</span></div><button class="volume" id="muteBtn" title="Tắt / bật tiếng">♬</button></aside><div class="toast" id="toast"></div><script src="https://www.youtube.com/iframe_api"></script><script src="config.local.js"></script><script src="app.js"></script></body></html>
